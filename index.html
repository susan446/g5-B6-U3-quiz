<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G5 Book6 Unit3 聽說練習闖關</title>
    
    <!-- 引入 Tailwind CSS 進行排版與設計 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 Lucide Icons 圖示庫 -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- 自訂動畫與列印樣式 -->
    <style>
        @keyframes zoom-in {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }

            animation: zoom-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;

            nav { display: none !important; }

</head>
<body class="bg-indigo-50/30 font-sans text-gray-900 pb-12 min-h-screen">

    <div id="app"></div>

    <script>
        // ✅ 替換為您的 Google Apps Script 網址
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxtmqvy9miyhwKQqFY_cSk_Cj2Uh_-qRZF_R8UZBxFLUTG9sm5C8LgrKY_KhM43BqHf/exec"; 

        // 統一定義圖片網址
        function createImg(content, text) {
            const isSvg = content.trim().startsWith('<');
            const visual = isSvg ? content : `<text x="50%" y="45%" font-size="180" text-anchor="middle" dominant-baseline="middle">${content}</text>`;
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
                <rect width="100%" height="100%" fill="#EEF2FF" rx="40"/>
                ${visual}
                <text x="50%" y="82%" font-size="45" font-family="sans-serif" font-weight="900" fill="#4F46E5" text-anchor="middle">${text}</text>
            </svg>`;
            return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
        }

        const IMAGES = {
            dress: createImg('👗', 'Dress'),
            skirt: createImg(`
                <path d="M 140 120 L 260 120 L 320 270 L 80 270 Z" fill="#F472B6"/>
                <path d="M 140 120 Q 200 145 260 120 L 260 135 Q 200 160 140 135 Z" fill="#DB2777"/>
                <path d="M 160 138 L 120 270 M 200 148 L 200 270 M 240 138 L 280 270" stroke="#DB2777" stroke-width="8" stroke-linecap="round"/>
            `, 'Skirt'), 
            sweater: createImg('🧥', 'Sweater'),
            tshirt: createImg('👕', 'T-shirt'),
            pants: createImg('👖', 'Pants'),
            shorts: createImg('🩳', 'Shorts'),
            sneakers: createImg(`
                <g transform="translate(135, 180) rotate(-5)">
                    <text x="0" y="0" font-size="140" text-anchor="middle" dominant-baseline="middle">👟</text>
                </g>
                <g transform="translate(265, 180) scale(-1, 1) rotate(-5)">
                    <text x="0" y="0" font-size="140" text-anchor="middle" dominant-baseline="middle">👟</text>
                </g>
            `, 'Sneakers'),
            socks: createImg('🧦', 'Socks')
        };

        const LESSONS = [
            {
                id: 1,
                title: "Unit 3 (Part 1): How much is the dress?",
                subtitle: "單字與單數句型",
                vocabulary: [
                    { word: "dress", chinese: "洋裝", sentence: "It is a beautiful dress.", img: IMAGES.dress },
                    { word: "skirt", chinese: "裙子", sentence: "I like this skirt.", img: IMAGES.skirt },
                    { word: "sweater", chinese: "毛衣", sentence: "It is a warm sweater.", img: IMAGES.sweater },
                    { word: "T-shirt", chinese: "T恤", sentence: "How much is the T-shirt?", img: IMAGES.tshirt }
                ],
                questions: [
                    { q: "How much is the dress?", chinese: "這件洋裝多少錢？", a: "dress", img: IMAGES.dress },
                    { q: "It's nine hundred dollars.", chinese: "它是九百元。(指洋裝)", a: "nine hundred", img: IMAGES.dress },
                    { q: "How much is the skirt?", chinese: "這件裙子多少錢？", a: "skirt", img: IMAGES.skirt },
                    { q: "It's two hundred and ninety dollars.", chinese: "它是二百九十元。(指裙子)", a: "ninety", img: IMAGES.skirt },
                    { q: "How much is the sweater?", chinese: "這件毛衣多少錢？", a: "sweater", img: IMAGES.sweater },
                    { q: "It's five hundred dollars.", chinese: "它是五百元。(指毛衣)", a: "five hundred", img: IMAGES.sweater },
                    { q: "How much is the T-shirt?", chinese: "這件T恤多少錢？", a: "t-shirt", img: IMAGES.tshirt },
                    { q: "It's three hundred dollars.", chinese: "它是三百元。(指T恤)", a: "three hundred", img: IMAGES.tshirt }
                ]
            },
            {
                id: 2,
                title: "Unit 3 (Part 2): How much are the pants?",
                subtitle: "複數名詞與價錢",
                vocabulary: [
                    { word: "pants", chinese: "長褲", sentence: "How much are the pants?", img: IMAGES.pants },
                    { word: "shorts", chinese: "短褲", sentence: "These are my shorts.", img: IMAGES.shorts },
                    { word: "sneakers", chinese: "運動鞋", sentence: "How much are the sneakers?", img: IMAGES.sneakers },
                    { word: "socks", chinese: "襪子", sentence: "They're thirty dollars.", img: IMAGES.socks }
                ],
                questions: [
                    { q: "How much are the pants?", chinese: "這件長褲多少錢？", a: "pants", img: IMAGES.pants },
                    { q: "They're four hundred and fifty dollars.", chinese: "它們是四百五十元。(指長褲)", a: "fifty", img: IMAGES.pants },
                    { q: "How much are the socks?", chinese: "這雙襪子多少錢？", a: "socks", img: IMAGES.socks },
                    { q: "They're thirty dollars.", chinese: "它們是三十元。(指襪子)", a: "thirty", img: IMAGES.socks },
                    { q: "How much are the sneakers?", chinese: "這雙運動鞋多少錢？", a: "sneakers", img: IMAGES.sneakers },
                    { q: "They're eight hundred dollars.", chinese: "它們是八百元。(指運動鞋)", a: "eight hundred", img: IMAGES.sneakers },
                    { q: "How much are the shorts?", chinese: "這件短褲多少錢？", a: "shorts", img: IMAGES.shorts },
                    { q: "They're two hundred dollars.", chinese: "它們是二百元。(指短褲)", a: "two hundred", img: IMAGES.shorts }
                ]
            }
        ];

        let state = {
            view: 'login',
            currentLesson: null,
            quizIndex: 0,
            answers: [],
            totalScore: 0,
            isListening: false,
            speechResult: '',
            feedback: null,
            accuracyScore: 0,
            fluencyScore: 0,
            isFinalQuiz: false,
            finalQuestions: [],
            errorDetails: '',
            completedLessons: [],
            studentInfo: { className: '', seatNumber: '', name: '' },
            showCertificate: false,
            isSubmitting: false,
            isSubmitted: false,
            submitError: null,
            vocabTarget: null,
            vocabSpeechResult: '',
            vocabAccuracy: 0,
            vocabFeedback: null,
            isListeningVocab: false
        };

        function updateState(newState) {
            state = { ...state, ...newState };
            render();
        }

        let recognition = null;
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                const confidence = event.results[0][0].confidence;
                
                if (state.view === 'study') {
                    state.vocabSpeechResult = transcript;
                    calculateVocabScores(transcript, confidence);
                } else {
                    state.speechResult = transcript;
                    calculateScores(transcript, confidence);
                }
            };

            recognition.onerror = (event) => {
                console.error("Speech Recognition Error:", event.error);
                if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                    alert("麥克風被阻擋了！🎤\n\n如果您在 Google 協作平台內看到此畫面，請改用「按鈕連結」另開新分頁。");
                }
                updateState({ isListening: false, isListeningVocab: false });
            };

            recognition.onend = () => {
                updateState({ isListening: false, isListeningVocab: false });
            };
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.6;
                window.speechSynthesis.speak(utterance);
            }
        }

        function startListeningBtn() {
            if (state.isListening) return; 
            updateState({ speechResult: '', feedback: null, isListening: true });
            if (recognition) {
                try { recognition.start(); } catch (e) { updateState({ isListening: false }); }
            }
        }

        function startVocabListening(word) {
            if (state.isListeningVocab) return; 
            updateState({ vocabTarget: word, vocabSpeechResult: '', vocabFeedback: null, isListeningVocab: true });
            if (recognition) {
                try { recognition.start(); } catch (e) { updateState({ isListeningVocab: false }); }
            }
        }

        // ✅ 更新版：強大的語音辨識正規化工具 (自動補全 dollars，解決漏字與數字誤判問題)
        function normalizeSpeechText(text) {
            let t = text.toLowerCase();
            
            // 1. 去除美金符號
            t = t.replace(/\$/g, "");
            
            // 2. 數字與常見錯誤強制替換表 (直接將數字對應到包含 dollars 的完整詞彙)
            const map = {
                "900": "nine hundred dollars",
                "290": "two hundred and ninety dollars",
                "500": "five hundred dollars",
                "300": "three hundred dollars",
                "450": "four hundred and fifty dollars",
                "415": "four hundred and fifty dollars", // 容錯辨識
                "30": "thirty dollars",
                "13": "thirty dollars", // 常見誤判
                "800": "eight hundred dollars",
                "200": "two hundred dollars",
                "dirty": "thirty",
                "teacher": "t-shirt",
                "t shirt": "t-shirt",
                "their": "theyre",
                "there": "theyre",
                "they re": "theyre"
            };
            
            for (let key in map) {
                let regex = new RegExp("\\b" + key + "\\b", "g");
                t = t.replace(regex, map[key]);
            }
            
            // 3. 避免學生真的有唸 dollars，替換後變成重複的 dollars dollars，做個修剪
            t = t.replace(/dollars dollars/g, "dollars");
            
            // 4. 處理縮寫與連字號
            t = t.replace(/'/g, "");
            t = t.replace(/-/g, " ");
            
            return t.trim();
        }

        function calculateVocabScores(result, confidence) {
            const targetNoSpace = state.vocabTarget.toLowerCase().replace(/[^a-z0-9]/g, ""); 
            let processedResult = normalizeSpeechText(result); // 使用新的正規化工具
            const noSpaceResult = processedResult.replace(/[^a-z0-9]/g, "");
            let acc = noSpaceResult.includes(targetNoSpace) ? 100 : Math.round(getSimilarity(targetNoSpace, noSpaceResult) * 100);
            state.vocabAccuracy = acc;
            state.vocabFeedback = acc >= 80 ? 'perfect' : 'retry';
            updateState({});
        }

        function getSimilarity(s1, s2) {
            const longer = s1.length > s2.length ? s1 : s2;
            const shorter = s1.length > s2.length ? s2 : s1;
            if (longer.length === 0) return 1.0;
            const costs = [];
            for (let i = 0; i <= s1.length; i++) {
                let lastValue = i;
                for (let j = 0; j <= s2.length; j++) {
                    if (i === 0) costs[j] = j;
                    else {
                        if (j > 0) {
                            let newValue = costs[j - 1];
                            if (s1.charAt(i - 1) !== s2.charAt(j - 1))
                                newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                            costs[j - 1] = lastValue;
                            lastValue = newValue;
                        }
                    }
                }
                if (i > 0) costs[s2.length] = lastValue;
            }
            return (longer.length - costs[s2.length]) / longer.length;
        }

        function calculateScores(result, confidence) {
            const questionList = state.isFinalQuiz ? state.finalQuestions : (state.currentLesson ? state.currentLesson.questions : []);
            const question = questionList[state.quizIndex];
            
            // 處理標準答案
            const baseTarget = question.q.toLowerCase().replace(/'/g, "");
            const targetForSim = baseTarget.replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim(); 
            
            // 處理學生語音 (使用新的正規化工具)
            let processedResult = normalizeSpeechText(result);
            const cleanResultForSim = processedResult.replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
            
            const similarity = getSimilarity(targetForSim, cleanResultForSim);
            let acc = Math.round(similarity * 100);
            let flu = Math.round(confidence * 100);
            
            // 針對特定縮寫的溫馨提醒 (若包含在目標句但學生沒唸出)
            let extraMsg = "";
            if (targetForSim.includes("its ") && !cleanResultForSim.includes("its ")) extraMsg = " (提醒：系統未聽到 It's)";
            if (targetForSim.includes("theyre ") && !cleanResultForSim.includes("theyre ")) extraMsg = " (提醒：系統未聽到 They're)";

            state.accuracyScore = acc;
            state.fluencyScore = flu;
            
            // 將系統真實聽到的原文與提醒顯示出來
            let extraMsgHtml = extraMsg ? `<br><span class="text-sm text-orange-500">${extraMsg}</span>` : "";
            state.errorDetails = `系統聽見："${result || '(無聲音)'}"${extraMsgHtml}`;
            state.feedback = acc >= 80 ? 'perfect' : 'retry'; // 放寬標準至 80 分
            updateState({}); 
        }

        function retryQuestion() { 
            updateState({ feedback: null, speechResult: '' }); 
        }

        function nextQuestion(acc, flu, finalResult) {
            const questionList = state.isFinalQuiz ? state.finalQuestions : (state.currentLesson ? state.currentLesson.questions : []);
            const avgScore = Math.round((acc + flu) / 2);
            state.answers.push({ 
                question: questionList[state.quizIndex].q,
                userAnswer: finalResult || state.speechResult,
                acc: acc,
                flu: flu,
                score: avgScore
            });
            
            if (state.quizIndex < questionList.length - 1) {
                state.quizIndex++;
            } else {
                state.totalScore = Math.round(state.answers.reduce((s, curr) => s + curr.score, 0) / state.answers.length);
                if (state.totalScore >= 85 && state.currentLesson && !state.completedLessons.includes(state.currentLesson.id)) { 
                    state.completedLessons.push(state.currentLesson.id);
                }
                state.view = 'result';
            }
            state.feedback = null;
            state.speechResult = '';
            updateState({});
        }

        function startFinalChallenge() {
            const allQuestions = [...LESSONS[0].questions, ...LESSONS[1].questions];
            const shuffled = allQuestions.sort(() => 0.5 - Math.random()).slice(0, 10);
            updateState({ finalQuestions: shuffled, isFinalQuiz: true, quizIndex: 0, answers: [], view: 'quiz' });
        }

        // ✅ 核心修改：回報明細功能
        async function submitToGoogleSheet() {
            if (!state.studentInfo.name || !state.studentInfo.className || !state.studentInfo.seatNumber) return;
            updateState({ isSubmitting: true, submitError: null });
            
            const avgAcc = Math.round(state.answers.reduce((s, a) => s + a.acc, 0) / state.answers.length);
            const avgFlu = Math.round(state.answers.reduce((s, a) => s + a.flu, 0) / state.answers.length);

            const payload = {
                className: state.studentInfo.className,
                seatNumber: state.studentInfo.seatNumber,
                name: state.studentInfo.name,
                totalScore: state.totalScore,
                accuracy: avgAcc,
                fluency: avgFlu,
                details: state.answers, // ✅ 將所有題目明細傳送出去
                timestamp: new Date().toLocaleString()
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                updateState({ isSubmitted: true, isSubmitting: false });
                setTimeout(() => updateState({ showCertificate: true }), 1200);
            } catch (error) {
                updateState({ submitError: "傳送失敗，請確認權限。", isSubmitting: false });
            }
        }

        function setView(view) { updateState({ view }); }
        function startStudy(id) { updateState({ currentLesson: LESSONS.find(l => l.id === id), view: 'study' }); }
        function startQuiz(id) { updateState({ currentLesson: LESSONS.find(l => l.id === id), quizIndex: 0, answers: [], view: 'quiz' }); }
        function submitNextQuestion() { nextQuestion(state.accuracyScore, state.fluencyScore, state.speechResult); }

        function renderLogin() {
            return `
                <div class="max-w-md mx-auto p-6 pt-16 animate-zoom-in">
                    <div class="bg-white rounded-[40px] shadow-2xl p-10 text-center border-t-8 border-indigo-600">
                        <h2 class="text-3xl font-black text-slate-800 mb-8">登入系統</h2>
                        <div class="space-y-4 mb-8 text-left">
                            <input type="text" oninput="state.studentInfo.className = this.value" placeholder="班級 (例如: 501)" class="w-full p-4 rounded-2xl border-2 border-slate-100 bg-slate-50 font-bold" />
                            <input type="number" oninput="state.studentInfo.seatNumber = this.value" placeholder="座號 (例如: 5)" class="w-full p-4 rounded-2xl border-2 border-slate-100 bg-slate-50 font-bold" />
                            <input type="text" oninput="state.studentInfo.name = this.value" placeholder="姓名" class="w-full p-4 rounded-2xl border-2 border-slate-100 bg-slate-50 font-bold" />
                        </div>
                        <button onclick="if(state.studentInfo.name) setView('home')" class="w-full bg-indigo-600 text-white py-5 rounded-2xl font-black text-xl shadow-lg">進入闖關</button>
                    </div>
                </div>
            `;
        }

        function renderHome() {
            let lessonsHtml = LESSONS.map(lesson => `
                <div class="bg-white rounded-3xl shadow-md border-b-4 border-indigo-100 p-8">
                    <h2 class="text-2xl font-black text-gray-800">${lesson.title}</h2>
                    <p class="text-indigo-400 font-bold mb-6">${lesson.subtitle}</p>
                    <div class="flex gap-4">
                        <button onclick="startStudy(${lesson.id})" class="flex-1 bg-slate-100 text-slate-600 py-4 rounded-2xl font-bold">1. 認識單字</button>
                        <button onclick="startQuiz(${lesson.id})" class="flex-1 bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg">2. 開始闖關</button>
                    </div>
                </div>
            `).join('');

            return `
                <div class="max-w-2xl mx-auto p-6 animate-zoom-in">
                    <header class="text-center mb-10"><h1 class="text-4xl font-black text-indigo-600">English Fun</h1></header>
                    <div class="grid gap-6 mb-10">${lessonsHtml}</div>
                    <button onclick="startFinalChallenge()" class="w-full bg-gradient-to-r from-indigo-600 to-purple-700 text-white py-6 rounded-[30px] font-black text-2xl shadow-xl">🏆 混合總測驗</button>
                </div>
            `;
        }

        function renderStudy() {
            let vocabHtml = state.currentLesson.vocabulary.map(v => `
                <div class="bg-white p-4 rounded-3xl flex items-center justify-between border border-slate-100 shadow-sm mb-4">
                    <div class="flex items-center gap-4">
                        <img src="${v.img}" class="w-20 h-20 rounded-2xl">
                        <div><h3 class="text-2xl font-black text-indigo-600">${v.word}</h3><p class="text-slate-400 font-bold">${v.chinese}</p></div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="speak('${v.word}')" class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center"><i data-lucide="volume-2"></i></button>
                        <button onclick="startVocabListening('${v.word}')" class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center"><i data-lucide="mic"></i></button>
                    </div>
                </div>
            `).join('');
            return `<div class="max-w-2xl mx-auto p-6 text-center animate-zoom-in">
                <button onclick="setView('home')" class="mb-6 font-black text-indigo-600 underline">返回選單</button>
                <div class="bg-slate-50 p-6 rounded-[40px]">${vocabHtml}</div>
            </div>`;
        }

        function renderQuiz() {
            const questionList = state.isFinalQuiz ? state.finalQuestions : state.currentLesson.questions;
            const q = questionList[state.quizIndex];
            const progress = ((state.quizIndex + 1) / questionList.length) * 100;

            return `
                <div class="max-w-xl mx-auto p-4 animate-zoom-in">
                    <div class="mb-6"><div class="w-full bg-white h-4 rounded-full p-1"><div class="bg-indigo-600 h-full rounded-full" style="width:${progress}%"></div></div></div>
                    <div class="bg-white rounded-[40px] shadow-xl p-8 text-center relative overflow-hidden min-h-[500px] flex flex-col justify-center">
                        ${state.feedback ? `
                            <div class="absolute inset-0 bg-white/95 z-20 flex flex-col items-center justify-center p-8 rounded-[40px]">
                                <h3 class="text-3xl font-black mb-2">${state.accuracyScore >= 80 ? "做得好！ 🎉" : "再試一次 💪"}</h3>
                                
                                <!-- ✅ 新增：把分數大大的顯示出來 -->
                                <div class="text-2xl font-black text-amber-500 mb-4">得分：${state.accuracyScore} 分</div>
                                
                                <p class="text-indigo-600 font-bold mb-8">${state.errorDetails}</p>
                                <div class="flex w-full gap-4">
                                    <button onclick="retryQuestion()" class="flex-1 bg-slate-100 py-4 rounded-2xl font-black text-slate-600">重講一次</button>
                                    <button onclick="submitNextQuestion()" class="flex-1 bg-indigo-600 text-white py-4 rounded-2xl font-black">下一題</button>
                                </div>
                            </div>
                        ` : ''}
                        <img src="${q.img}" class="w-full max-h-56 object-cover rounded-2xl mb-6 shadow-sm">
                        <h2 class="text-4xl font-black text-indigo-600 mb-2">${q.q}</h2>
                        <p class="text-xl font-bold text-slate-400 mb-10">${q.chinese}</p>
                        <button onclick="startListeningBtn()" class="w-24 h-24 mx-auto rounded-full ${state.isListening ? 'bg-red-500 animate-pulse' : 'bg-indigo-600'} text-white shadow-xl flex items-center justify-center">
                            <i data-lucide="mic" class="w-10 h-10"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        function renderResult() {
            if (state.showCertificate) {
                return `<div class="max-w-xl mx-auto p-6 text-center animate-zoom-in">
                    <div class="bg-white rounded-[40px] p-10 border-8 border-amber-400 shadow-2xl">
                        <i data-lucide="award" class="w-24 h-24 text-amber-500 mx-auto mb-6"></i>
                        <h1 class="text-4xl font-black mb-8">恭喜完成！</h1>
                        <p class="text-xl font-bold mb-2">${state.studentInfo.name} 同學</p>
                        <p class="text-3xl font-black text-indigo-600">總分：${state.totalScore}</p>
                        <button onclick="location.reload()" class="mt-10 bg-slate-800 text-white px-10 py-4 rounded-2xl font-black">重新開始</button>
                    </div>
                </div>`;
            }

            return `<div class="max-w-2xl mx-auto p-4 animate-zoom-in">
                <div class="bg-white rounded-[40px] shadow-xl p-8 text-center">
                    <h2 class="text-3xl font-black mb-8">測驗結果：${state.totalScore} 分</h2>
                    <div class="mb-8 text-left space-y-2">
                        ${state.answers.map((a, i) => `<div class="p-3 bg-slate-50 rounded-xl text-sm"><b>${i+1}.</b> ${a.question}<br><span class="text-indigo-500">聽見：${a.userAnswer}</span> (分：${a.score})</div>`).join('')}
                    </div>
                    ${state.isFinalQuiz ? `
                        <button onclick="submitToGoogleSheet()" class="w-full bg-indigo-600 text-white py-5 rounded-2xl font-black text-xl mb-4">
                            ${state.isSubmitting ? '送出中...' : '送出成績'}
                        </button>
                    ` : ''}
                    <button onclick="setView('home')" class="w-full bg-slate-100 py-4 rounded-2xl font-black">返回主頁</button>
                </div>
            </div>`;
        }

        function render() {
            const app = document.getElementById('app');
            let content = '';
            switch (state.view) {
                case 'login': content = renderLogin(); break;
                case 'home': content = renderHome(); break;
                case 'study': content = renderStudy(); break;
                case 'quiz': content = renderQuiz(); break;
                case 'result': content = renderResult(); break;
            }
            app.innerHTML = content;
            if (window.lucide) lucide.createIcons();
        }

        render();
    </script>
</body>
</html>
