    <script>
        const config = {

        const fullScript = [
            // Scene 1
            { speaker: "Narrator", text: "Three friends, Leo, Mia, and Toby, are on an adventure on Eco Island. They are looking for a secret treasure.", emotion: "Calm and clear (平穩清晰)", keywords: ["adventure", "island", "treasure"] },
            { speaker: "Chorus", text: "Step, step, step! Here we go! Deep in the jungle, fast and slow!", emotion: "Rhythmic, upbeat (節奏感高亢)", keywords: ["step", "jungle", "fast", "slow"] },
            { speaker: "Leo", text: "Look at this old map! The treasure is near the big river! I am so excited!", emotion: "Excited, confident (興奮且充滿自信)", keywords: ["map", "river", "excited"] },
            { speaker: "Mia", text: "Me too! An adventure in the jungle is so cool!", emotion: "Curious, happy (好奇喜悅)", keywords: ["adventure", "jungle", "cool"] },
            { speaker: "Toby", text: "But wait... why are there so many plastic bottles on the ground?", emotion: "Confused, worried (困惑擔憂)", keywords: ["plastic", "bottles", "ground"] },
            { speaker: "Leo", text: "Forget the bottles! We need to find the gold!", emotion: "Impatient, focused (急切專注)", keywords: ["forget", "gold"] },
            { speaker: "Toby", text: "Guys... I hear a weird noise. Grrr... Grrr...", emotion: "Trembling, scared (發抖害怕)", keywords: ["weird", "noise", "grrr"] },
            { speaker: "Mia", text: "What is that? Is it a wild animal?", emotion: "Curious, slight fear (好奇帶點微懼)", keywords: ["wild", "animal"] },
            { speaker: "Toby", text: "Oh no! I am so scared! Is it a monster?", emotion: "Very scared, panicking (極度驚恐恐慌)", keywords: ["scared", "monster"] },
            { speaker: "Chorus", text: "Shhh! Listen! Thump! Thump! Thump! Here comes the monster!", emotion: "Suspenseful (Shhh請唸噓~~~拉長音，營造緊張感)", keywords: ["shhh", "listen", "thump", "monster"] },
            // Scene 2
            { speaker: "Narrator", text: "A giant creature steps out from behind the trees. It is covered in plastic bags and paper cups!", emotion: "Dramatic (高潮迭起戲劇化)", keywords: ["creature", "plastic", "bags", "cups"] },
            { speaker: "Eco Spirit", text: "STOP! Who is making noise in my forest?!", emotion: "Angry and loud (憤怒且大聲)", keywords: ["stop", "noise", "forest"] },
            { speaker: "Toby", text: "Ahh! Help! It's a trash monster! It's going to eat us!", emotion: "Screaming, terrified (尖叫驚恐)", keywords: ["help", "trash", "monster"] },
            { speaker: "Mia", text: "Wait, Toby! Look closely. It's not a monster!", emotion: "Observant, calming (仔細觀察並安撫)", keywords: ["wait", "closely", "monster"] },
            { speaker: "Leo", text: "Look! There are plastic straws on its head and plastic bags on its arms!", emotion: "Surprised (極度吃驚)", keywords: ["plastic", "straws", "bags", "arms"] },
            { speaker: "Eco Spirit", text: "I am not a monster. I am the Eco Spirit of this island.", emotion: "Sad, sighing (悲傷嘆息)", keywords: ["monster", "spirit", "island"] },
            { speaker: "Mia", text: "Why are you so sad and angry?", emotion: "Empathetic (同理問候)", keywords: ["sad", "angry"] },
            { speaker: "Eco Spirit", text: "Because people visit this island and leave all their trash here! I can't move, and I can't breathe!", emotion: "Frustrated, sad (無奈難過痛心)", keywords: ["trash", "move", "breathe"] },
            { speaker: "Chorus", text: "Sad, sad, so sad! Mad, mad, so mad! Save our forest! Don't be bad!", emotion: "Rhythmic, chanting (節奏感呼喊)", keywords: ["sad", "mad", "save", "forest"] },
            { speaker: "Leo", text: "That's terrible! Pollution is hurting our planet!", emotion: "Shocked, realizing (震撼頓悟)", keywords: ["terrible", "pollution", "planet"] },
            // Scene 3
            { speaker: "Narrator", text: "The kids decide to stop looking for gold and help the Eco Spirit.", emotion: "Warm, hopeful (溫馨希望)", keywords: ["stop", "gold", "help"] },
            { speaker: "Mia", text: "Don't worry, Eco Spirit! We can help you!", emotion: "Encouraging (鼓勵給予信心)", keywords: ["worry", "help"] },
            { speaker: "Toby", text: "Yes! Let's pick up the trash together!", emotion: "Brave, helpful (勇敢挺身而出)", keywords: ["pick", "trash", "together"] },
            { speaker: "Leo", text: "Plastic bottles go into the recycling bin! Paper cups go here!", emotion: "Leading, energetic (有指揮力的活力)", keywords: ["bottles", "recycling", "bin", "cups"] },
            { speaker: "Chorus", text: "Clean up, clean up, pick it up! Reduce! Reuse! Recycle! Clean up, clean up, pick it up! One, two, three, pull!", emotion: "Upbeat action rhythm (充滿動感的呼喊)", keywords: ["clean", "reduce", "reuse", "recycle", "pull"] },
            { speaker: "Narrator", text: "The kids pull off all the plastic bags and cups from the Eco Spirit.", emotion: "Action oriented (動作連貫描述)", keywords: ["pull", "bags", "cups"] },
            { speaker: "Eco Spirit", text: "Ahhh! Thank you! I feel so relieved and happy now! The air is fresh again!", emotion: "Smiling happily, relieved (舒暢感激喜悅)", keywords: ["thank", "relieved", "happy", "fresh"] },
            { speaker: "Toby", text: "But wait... we didn't find the gold treasure.", emotion: "A bit disappointed, confused (微失望與疑惑)", keywords: ["find", "gold", "treasure"] },
            { speaker: "Eco Spirit", text: "Look around you! Fresh air, green trees, and a clean Earth. THAT is the most precious treasure in the world!", emotion: "Wise, joyous (睿智讚讚)", keywords: ["fresh", "green", "clean", "precious", "treasure"] },
            { speaker: "Leo", text: "Wow... it is so beautiful!", emotion: "Awestruck (真誠讚賞感動)", keywords: ["wow", "beautiful"] },
            { speaker: "Mia", text: "A clean Earth is better than gold!", emotion: "Happy realization (快樂領悟)", keywords: ["clean", "earth", "better", "gold"] },
            { speaker: "Chorus", text: "Protect the Earth! Save the world! We are the Eco Heroes! YEAH!", emotion: "Loud, triumphant (歡呼勝利終曲)", keywords: ["protect", "save", "heroes", "yeah"] }
        ];

        const state = {
            student: { name: "", isPreview: false },
            character: "",
            practiceLines: [],
            currentIndex: 0,
            allRecordings: {}, // Multi-role recordings storage across character switches!
            isRecording: false,
            latestTranscript: "",
            isSimulationMode: false
        };

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let currentAudioBlobUrl = null;
        let stream = null;

        const punctuationRegex = /[.,?!'"-;:]/g;
        const numberMap = { "1": "one", "2": "two", "3": "three", "4": "four", "5": "five" };
        const fuzzyMap = { "dirty": "thirty", "teacher": "tshirt", "there": "their", "theyre": "prior" };

        function normalizeText(text) {
            if(!text) return "";
            let t = text.toLowerCase().replace(punctuationRegex, "");
            t = t.replace(/it s /g, "its ").replace(/they re /g, "theyre ");
            let words = t.split(/\s+/);
            words = words.map(w => numberMap[w] || fuzzyMap[w] || w);
            return words.join(" ").trim();
        }

        let audioCtx = null;
        let currentShhNode = null;
        let shhTimeout = null;

        function playSynthesizedShhSound(durationSeconds, onEndCallback) {
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!audioCtx) {
                    audioCtx = new AudioContextClass();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const sampleRate = audioCtx.sampleRate;
                const bufferSize = sampleRate * durationSeconds;
                const buffer = audioCtx.createBuffer(1, bufferSize, sampleRate);
                const output = buffer.getChannelData(0);

                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }

                const whiteNoise = audioCtx.createBufferSource();
                whiteNoise.buffer = buffer;

                const bandpass = audioCtx.createBiquadFilter();
                bandpass.type = "bandpass";
                bandpass.frequency.value = 3200;
                bandpass.Q.value = 1.3;

                const highpass = audioCtx.createBiquadFilter();
                highpass.type = "highpass";
                highpass.frequency.value = 1600;

                const gainNode = audioCtx.createGain();
                const now = audioCtx.currentTime;

                gainNode.gain.setValueAtTime(0.001, now);
                gainNode.gain.exponentialRampToValueAtTime(0.4, now + 0.15);
                gainNode.gain.setValueAtTime(0.4, now + durationSeconds - 0.4);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + durationSeconds);

                whiteNoise.connect(bandpass);
                bandpass.connect(highpass);
                highpass.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                whiteNoise.start(now);
                whiteNoise.stop(now + durationSeconds);
                currentShhNode = whiteNoise;

                shhTimeout = setTimeout(() => {
                    currentShhNode = null;
                    if (onEndCallback) onEndCallback();
                }, durationSeconds * 1000);

            } catch (err) {
                console.warn("Web Audio Shh synthesis error:", err);
                if (onEndCallback) onEndCallback();
            }
        }

        function stopSynthesizedShhSound() {
            if (shhTimeout) {
                clearTimeout(shhTimeout);
                shhTimeout = null;
            }
            if (currentShhNode) {
                try { currentShhNode.stop(); } catch(e){}
                currentShhNode = null;
            }
        }

        const app = {
            showToast: (msg) => {
                const toast = document.getElementById("toastMsg");
                if (toast) {
                    toast.innerText = msg;
                    toast.classList.remove("hidden");
                    setTimeout(() => toast.classList.add("hidden"), 3500);
                }
            },

            login: (isPreview = false) => {
                const nameInput = document.getElementById("studentName").value.trim();
                if (!nameInput && !isPreview) {
                    app.showToast("⚠️ 請先輸入你的姓名！");
                    return;
                }
                state.student.name = isPreview ? "Teacher (Preview)" : nameInput;
                state.student.isPreview = isPreview;

                if (isPreview) {
                    document.getElementById("devGearBtn").classList.remove("hidden");
                    app.populateDevModal();
                }

                document.getElementById("stage-login").classList.add("hidden-stage");
                document.getElementById("welcomeMsg").innerText = `歡迎，${state.student.name}！`;
                document.getElementById("stage-char-select").classList.remove("hidden-stage");
                app.updateCharBadges();
            },

            selectCharacter: (charName) => {
                state.character = charName;
                state.practiceLines = fullScript.filter(line => line.speaker === charName || line.speaker === "Chorus");
                state.currentIndex = 0;
                
                // Retain multi-role recording state
                if (!state.allRecordings[charName]) {
                    state.allRecordings[charName] = [];
                }

                let possesiveName = state.student.name.endsWith('s') ? `${state.student.name}'` : `${state.student.name}'s`;
                document.getElementById("nameTag").innerText = `${possesiveName} ${charName} 特訓`;

                document.getElementById("stage-char-select").classList.add("hidden-stage");
                document.getElementById("stage-practice").classList.remove("hidden-stage");
                
                app.initMicrophone();
                app.loadLine();
            },

            updateCharBadges: () => {
                const roles = ["Narrator", "Leo", "Mia", "Toby", "Eco Spirit"];
                roles.forEach(role => {
                    const recs = state.allRecordings[role];
                    const badge = document.getElementById(`badge-${role}`);
                    if (badge) {
                        if (recs && recs.some(r => r && r.audioUrl)) {
                            badge.classList.remove("hidden");
                        } else {
                            badge.classList.add("hidden");
                        }
                    }
                });
            },

            backToCharSelect: () => {
                app.stopTTS();
                document.getElementById("stage-practice").classList.add("hidden-stage");
                document.getElementById("stage-summary").classList.add("hidden-stage");
                document.getElementById("stage-char-select").classList.remove("hidden-stage");
                app.updateCharBadges();
            },

            initMicrophone: async () => {
                try {
                    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                        state.isSimulationMode = true;
                        return;
                    }
                    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    state.isSimulationMode = false;
                } catch (err) {
                    console.warn("Microphone non-fatal warning:", err);
                    state.isSimulationMode = true;
                    if (err.name === 'NotFoundError' || err.message.includes('Requested device not found')) {
                        app.showToast("💡 未偵測到實體麥克風，已自動啟用模擬測試模式！");
                    } else {
                        app.showToast("💡 麥克風未授權，已啟用模擬測試模式！");
                    }
                }
            },

            loadLine: () => {
                app.stopTTS();

                const line = state.practiceLines[state.currentIndex];
                document.getElementById("progressIndicator").innerText = `Line ${state.currentIndex + 1} / ${state.practiceLines.length}`;
                
                const emojiMap = { "Narrator": "📖", "Leo": "🦁", "Mia": "🌸", "Toby": "🍩", "Eco Spirit": "🌳", "Chorus": "👥" };
                document.getElementById("currentCharEmoji").innerText = emojiMap[line.speaker] || "🎭";
                document.getElementById("speakerLabel").innerText = line.speaker;
                document.getElementById("targetText").innerText = line.text;
                document.getElementById("emotionHint").innerText = `💡 語氣要求：${line.emotion}`;

                document.getElementById("feedbackArea").classList.add("hidden");
                document.getElementById("actionBtns").classList.add("hidden");
                document.getElementById("recordText").innerText = "點擊開始錄音";
                document.getElementById("recordIcon").innerText = "🔴";
                document.getElementById("recordBtn").classList.remove("recording-pulse", "hidden");

                const activeRecs = state.allRecordings[state.character] || [];
                const existingRec = activeRecs[state.currentIndex];
                if (existingRec && existingRec.audioUrl) {
                    currentAudioBlobUrl = existingRec.audioUrl;
                    document.getElementById("myAudioBtn").classList.remove("hidden");
                } else {
                    currentAudioBlobUrl = null;
                    document.getElementById("myAudioBtn").classList.add("hidden");
                }
            },

            prevLine: () => {
                if (state.currentIndex > 0) {
                    state.currentIndex--;
                    app.loadLine();
                }
            },

            nextLine: () => {
                if (state.currentIndex < state.practiceLines.length - 1) {
                    state.currentIndex++;
                    app.loadLine();
                } else {
                    app.finishPractice();
                }
            },

            toggleTTS: () => {
                if (speechSynthesis.speaking) {
                    if (speechSynthesis.paused) {
                        speechSynthesis.resume();
                        document.getElementById("ttsIcon").innerText = "⏸️";
                        document.getElementById("ttsText").innerText = "暫停";
                    } else {
                        speechSynthesis.pause();
                        document.getElementById("ttsIcon").innerText = "▶️";
                        document.getElementById("ttsText").innerText = "繼續";
                    }
                } else {
                    app.playTTS();
                }
            },

            stopTTS: () => {
                stopSynthesizedShhSound();
                speechSynthesis.cancel();
                document.getElementById("ttsIcon").innerText = "🔊";
                document.getElementById("ttsText").innerText = "聽示範";
                document.getElementById("ttsStopBtn").classList.add("hidden");
            },

            playTTS: () => {
                app.stopTTS();
                const line = state.practiceLines[state.currentIndex];
                if (!line) return;

                let textToSpeak = line.text;
                const hasShh = /Shhh!?|shhh!?|Shh!?/i.test(textToSpeak);

                document.getElementById("ttsIcon").innerText = "⏸️";
                document.getElementById("ttsText").innerText = "暫停";
                document.getElementById("ttsStopBtn").classList.remove("hidden");

                if (hasShh) {
                    playSynthesizedShhSound(1.8, () => {
                        let remainingText = textToSpeak.replace(/Shhh!?|shhh!?|Shh!?/gi, "").trim();
                        if (remainingText) {
                            app.speakUtterance(remainingText, line);
                        } else {
                            app.stopTTS();
                        }
                    });
                } else {
                    app.speakUtterance(textToSpeak, line);
                }
            },

            speakUtterance: (textToSpeak, line) => {
                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.lang = "en-US";

                const voices = speechSynthesis.getVoices();
                let isFemale = (line.speaker === "Mia");
                let targetVoice = voices.find(v => v.lang.includes("en-US") && v.name.toLowerCase().includes(isFemale ? "female" : "male"));
                if (!targetVoice) targetVoice = voices.find(v => v.lang.includes("en-US") || v.lang.includes("en"));
                if (targetVoice) utterance.voice = targetVoice;

                if (line.emotion.includes("Excited") || line.emotion.includes("Loud") || line.emotion.includes("Screaming")) {
                    utterance.pitch = 1.3;
                    utterance.rate = 1.05;
                } else if (line.emotion.includes("Sad") || line.emotion.includes("Scared")) {
                    utterance.pitch = 0.8;
                    utterance.rate = 0.85;
                } else {
                    utterance.pitch = 1.0;
                    utterance.rate = 0.95;
                }

                utterance.onend = () => { app.stopTTS(); };
                utterance.onerror = () => { app.stopTTS(); };

                speechSynthesis.speak(utterance);
            },

            toggleRecording: () => {
                if (!state.isRecording) {
                    app.startRecording();
                } else {
                    app.stopRecording();
                }
            },

            startRecording: async () => {
                app.stopTTS();
                
                if (!stream && !state.isSimulationMode) {
                    await app.initMicrophone();
                }

                state.isRecording = true;
                state.latestTranscript = "";
                
                document.getElementById("recordText").innerText = "⏹ 點擊結束錄音";
                document.getElementById("recordIcon").innerText = "";
                document.getElementById("recordBtn").classList.add("recording-pulse");
                document.getElementById("feedbackArea").classList.add("hidden");
                document.getElementById("myAudioBtn").classList.add("hidden");
                audioChunks = [];

                if (stream && !state.isSimulationMode) {
                    try {
                        mediaRecorder = new MediaRecorder(stream);
                        mediaRecorder.ondataavailable = e => { if(e.data.size > 0) audioChunks.push(e.data); };
                        mediaRecorder.onstop = () => {
                            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                            currentAudioBlobUrl = URL.createObjectURL(audioBlob);
                            document.getElementById("myAudioBtn").classList.remove("hidden");
                            
                            if (!state.allRecordings[state.character]) {
                                state.allRecordings[state.character] = [];
                            }
                            state.allRecordings[state.character][state.currentIndex] = {
                                speaker: state.practiceLines[state.currentIndex].speaker,
                                text: state.practiceLines[state.currentIndex].text,
                                audioUrl: currentAudioBlobUrl
                            };
                        };
                        mediaRecorder.start();

                        if (SpeechRecognition) {
                            recognition = new SpeechRecognition();
                            recognition.lang = 'en-US';
                            recognition.continuous = true;
                            recognition.interimResults = false;
                            
                            recognition.onresult = (event) => {
                                let currentTranscript = '';
                                for (let i = 0; i < event.results.length; ++i) {
                                    currentTranscript += event.results[i][0].transcript + " ";
                                }
                                state.latestTranscript = currentTranscript.trim();
                            };
                            recognition.onerror = (e) => console.log("Recog Error: ", e.error);
                            recognition.start();
                        }
                    } catch (recErr) {
                        console.warn("Recorder start error, fallback to simulation:", recErr);
                        state.isSimulationMode = true;
                    }
                }
            },

            stopRecording: () => {
                state.isRecording = false;
                document.getElementById("recordText").innerText = "評分中...";
                document.getElementById("recordBtn").classList.remove("recording-pulse");
                
                if (mediaRecorder && mediaRecorder.state !== "inactive") {
                    try { mediaRecorder.stop(); } catch(e){}
                }
                if (recognition) {
                    try { recognition.stop(); } catch(e){}
                }

                // 【修復】移除原先會自動給予滿分的作弊機制，改為真實呈現或模擬測試字串
                if (state.isSimulationMode) {
                    state.latestTranscript = "I think it is a monster"; // 模擬模式下的刻意錯誤示範字串
                    app.showToast("💡 模擬模式：使用錯誤測試字串進行評分展示");
                }

                setTimeout(() => {
                    app.evaluateSpeech(state.latestTranscript || "");
                }, 750);
            },

            evaluateSpeech: (transcript) => {
                const line = state.practiceLines[state.currentIndex];
                const targetText = line.text;
                
                if(!transcript || transcript.trim() === "") {
                    document.getElementById("recognizedText").innerHTML = `<strong>辨識到的內容：</strong> <span class="text-red-500">(未偵測到清晰聲音)</span>`;
                    document.getElementById("feedbackMsg").innerHTML = `
                        <div class="text-red-600 font-bold mb-2">❌ 未偵測到完整聲音，請靠近麥克風再試一次！</div>
                        <div class="text-sm text-gray-800 bg-white/95 p-4 rounded-xl space-y-2 border border-gray-200">
                            <p><strong>1. 漏唸 / 未聽清楚的字：</strong> 整句台詞未偵測到</p>
                            <p><strong>2. 發音不正確 / 多唸的字：</strong> 無</p>
                            <div class="mt-3 pt-3 border-t border-gray-200">
                                <p><strong>3. 語調與情緒建議：</strong> 請放大聲音並保持發音清晰。</p>
                            </div>
                        </div>
                    `;
                    document.getElementById("feedbackArea").className = "mt-6 p-5 rounded-2xl border-2 bg-red-50 border-red-300 block";
                    document.getElementById("actionBtns").classList.remove("hidden");
                    document.getElementById("recordBtn").classList.add("hidden");
                    return;
                }

                document.getElementById("recognizedText").innerHTML = `<strong>辨識到的內容：</strong> "${transcript.trim()}"`;
                
                const normTargetStr = normalizeText(targetText);
                const normRecognizedStr = normalizeText(transcript);

                const targetWords = normTargetStr.split(/\s+/).filter(Boolean);
                const recognizedWords = normRecognizedStr.split(/\s+/).filter(Boolean);

                const missingWords = [];
                const matchedWords = [];
                const recSet = [...recognizedWords];

                targetWords.forEach(w => {
                    const idx = recSet.indexOf(w);
                    if (idx !== -1) {
                        matchedWords.push(w);
                        recSet.splice(idx, 1); 
                    } else {
                        missingWords.push(w);
                    }
                });

                const incorrectWords = recSet;
                const wordAccuracy = targetWords.length > 0 ? (matchedWords.length / targetWords.length) : 1;

                let intonationAdvice = "";
                const rawText = targetText.trim();
                const endsWithQuestion = rawText.endsWith("?");
                const endsWithExclamation = rawText.endsWith("!");

                if (endsWithQuestion) {
                    intonationAdvice = "這是【問句】，句尾語調必須顯著上揚 ↗️，表現出疑問感！";
                } else if (endsWithExclamation) {
                    intonationAdvice = "這是【驚嘆句】，語調需重音加強並向上揚 ↗️，充分展現情緒張力！";
                } else {
                    intonationAdvice = "這是【陳述句】，句尾語調請自然平緩下降 ↘。";
                }

                intonationAdvice += `<br>👉 <strong>比賽情緒要求：</strong>語氣需展現『${line.emotion}』！`;

                let accuracyMsg = "";
                let feedbackClass = "";
                let isPassed = false;

                // 【修復】依照實際準確率給予對應的動態指導評語
                if (wordAccuracy >= 0.8) {
                    isPassed = true;
                    accuracyMsg = "✅ 發音非常精準！";
                    intonationAdvice = `你幾乎唸對了所有的字！接下來請點擊「聽自己聲音」，確認是否有做到：<br><span class="text-indigo-900 font-bold">${intonationAdvice}</span>`;
                    feedbackClass = "bg-emerald-50 border-emerald-300";
                } else if (wordAccuracy >= 0.4) {
                    isPassed = false;
                    accuracyMsg = "⚠️ 發音大致正確，但有部分字詞漏唸或唸錯囉！";
                    intonationAdvice = `部分發音不夠清晰，會影響語氣的展現。請先放慢速度唸對單字，並注意：<br><span class="text-amber-900 font-bold">${intonationAdvice}</span>`;
                    feedbackClass = "bg-amber-50 border-amber-300";
                } else {
                    isPassed = false;
                    accuracyMsg = "❌ 辨識到的內容與台詞差異過大！";
                    intonationAdvice = `系統無法清楚辨識你的發音。請務必先「聽示範」，一個字一個字唸清楚，再嘗試加入情緒：<br><span class="text-red-900 font-bold">${intonationAdvice}</span>`;
                    feedbackClass = "bg-red-50 border-red-300";
                }

                let missingText = missingWords.length > 0 
                    ? `<span class="text-red-600 font-bold">${missingWords.join(", ")}</span>` 
                    : `<span class="text-emerald-700 font-bold">無（完整唸出所有字）</span>`;

                let incorrectText = incorrectWords.length > 0 
                    ? `<span class="text-amber-700 font-bold">${incorrectWords.join(", ")}</span>` 
                    : `<span class="text-emerald-700 font-bold">無（發音精準，無多餘字詞）</span>`;

                let feedbackHtml = `
                    <div class="${isPassed ? 'text-emerald-800' : (wordAccuracy >= 0.4 ? 'text-amber-700' : 'text-red-600')} font-bold text-lg mb-2">
                        ${accuracyMsg}
                    </div>
                    <div class="text-sm text-gray-800 bg-white/95 p-4 rounded-xl space-y-2 border border-gray-200">
                        <p><strong>1. 漏唸 / 未聽清楚的字：</strong> ${missingText}</p>
                        <p><strong>2. 發音不正確 / 多唸的字：</strong> ${incorrectText}</p>
                        <div class="mt-3 pt-3 border-t border-gray-200">
                            <p><strong>3. 語調與情緒建議：</strong> <br><span class="inline-block mt-1">${intonationAdvice}</span></p>
                        </div>
                    </div>
                `;

                const fbArea = document.getElementById("feedbackArea");
                fbArea.className = `mt-6 p-5 rounded-2xl border-2 ${feedbackClass} block`;
                document.getElementById("feedbackMsg").innerHTML = feedbackHtml;
                
                document.getElementById("actionBtns").classList.remove("hidden");
                document.getElementById("recordBtn").classList.add("hidden");
            },

            playMyAudio: () => {
                if (currentAudioBlobUrl) {
                    const audio = new Audio(currentAudioBlobUrl);
                    audio.play();
                } else {
                    app.showToast("🎧 模擬錄音完成，已儲存紀錄！");
                }
            },

            retry: () => {
                document.getElementById("feedbackArea").classList.add("hidden");
                document.getElementById("actionBtns").classList.add("hidden");
                document.getElementById("recordBtn").classList.remove("hidden");
                document.getElementById("recordText").innerText = "點擊開始錄音";
            },

            finishPractice: () => {
                app.stopTTS();
                document.getElementById("stage-practice").classList.add("hidden-stage");
                document.getElementById("stage-summary").classList.remove("hidden-stage");
                
                app.renderSummaryForRole(state.character);
            },

            renderSummaryForRole: (roleName) => {
                const tabs = document.getElementById("summaryTabs");
                tabs.innerHTML = "";

                const rolesWithRecs = ["Narrator", "Leo", "Mia", "Toby", "Eco Spirit"];
                rolesWithRecs.forEach(r => {
                    const hasData = state.allRecordings[r] && state.allRecordings[r].some(item => item && item.audioUrl);
                    const tabBtn = document.createElement("button");
                    tabBtn.className = `px-3.5 py-1.5 rounded-xl font-bold text-xs sm:text-sm transition ${r === roleName ? 'bg-indigo-600 text-white shadow-md' : 'bg-white/80 text-gray-700 hover:bg-white'}`;
                    tabBtn.innerHTML = `${r} ${hasData ? '✨' : ''}`;
                    tabBtn.onclick = () => app.renderSummaryForRole(r);
                    tabs.appendChild(tabBtn);
                });

                const list = document.getElementById("summaryList");
                list.innerHTML = "";
                
                const roleLines = fullScript.filter(line => line.speaker === roleName || line.speaker === "Chorus");
                const roleRecs = state.allRecordings[roleName] || [];

                roleLines.forEach((line, idx) => {
                    const rec = roleRecs[idx];
                    const item = document.createElement("div");
                    item.className = "glass-panel p-4 rounded-2xl flex items-center justify-between border border-white/60";
                    item.innerHTML = `
                        <div class="flex-1 pr-4">
                            <span class="text-xs font-bold bg-indigo-600 text-white px-2.5 py-1 rounded-md">${line.speaker}</span>
                            <p class="text-sm font-bold text-gray-800 mt-2">${line.text}</p>
                        </div>
                        ${rec && rec.audioUrl 
                            ? `<button onclick="new Audio('${rec.audioUrl}').play()" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-md flex-shrink-0 flex items-center gap-1 btn-hover">▶ 聽自己</button>`
                            : `<span class="text-xs text-gray-500 font-medium bg-gray-200 px-2.5 py-1 rounded-md">尚未錄音</span>`
                        }
                    `;
                    list.appendChild(item);
                });

                if (!state.student.isPreview) {
                    app.sendData();
                } else {
                    document.getElementById("sheetStatus").innerText = "※ 預覽模式：不傳送成績至資料庫。";
                }
            },

            sendData: () => {
                document.getElementById("sheetStatus").innerText = "正在將完成紀錄傳送至老師的資料庫...";
                setTimeout(() => {
                    document.getElementById("sheetStatus").innerHTML = "✅ 紀錄已成功傳送！老師會看到你的努力喔！";
                }, 1200);
            },

            populateDevModal: () => {
                let html = "";
                fullScript.forEach((line, idx) => {
                    html += `
                    <div class="border-b border-gray-200 pb-3 mb-3">
                        <strong class="text-indigo-800">Line ${idx+1} [${line.speaker}]</strong><br>
                        Text: ${line.text}<br>
                        <span class="text-emerald-700 font-medium">Keywords: ${line.keywords.join(", ")}</span><br>
                        <span class="text-gray-500">Emotion: ${line.emotion}</span>
                    </div>`;
                });
                document.getElementById("devContent").innerHTML = html;
            }
        };

        document.getElementById("devGearBtn").addEventListener("click", () => {
            document.getElementById("devModal").classList.remove("hidden");
        });
    </script>
</body>
</html>
